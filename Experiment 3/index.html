<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List | Workspace</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card todo-card">
        <div class="card-header bg-white border-bottom p-4">
            <div class="header-subtitle">Workspace Overview</div>
            <h1 class="h4 fw-bold mb-0">To-Do List</h1>
        </div>

        <div class="card-body p-4">

            <form id="todo-form" class="mb-4">
                <div class="input-group">
                    <input type="text" id="todo-input" class="form-control" placeholder="Add a new task..." autocomplete="off" required>
                    <button class="btn btn-add fw-semibold px-4" type="submit">
                        <i class="bi bi-plus-lg me-1"></i> Add
                    </button>
                </div>
            </form>
            <div class="filter-container p-1 rounded-3 mb-3">
                <ul class="nav nav-pills nav-fill" id="filter-tabs">
                    <li class="nav-item">
                        <button class="nav-link active" data-filter="all">All</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" data-filter="active">Pending</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" data-filter="completed">Completed</button>
                    </li>
                </ul>
            </div>

            <div class="todo-list-container pe-1">
                <ul class="list-group list-group-flush" id="todo-list"></ul>
         
            <div id="empty-state" class="text-center py-4 text-muted small" style="display: none;">
                <i class="bi bi-clipboard-check fs-3 d-block mb-2"></i>
                No action items available.
            </div>

            <div class="d-flex justify-content-between align-items-center pt-3 mt-3 border-top small">
                <span id="task-count">0 items remaining</span>
                <button id="clear-completed" class="btn btn-link text-decoration-none p-0 small" style="display: none;">
                    Clear Completed
                </button>
            </div>

        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const todoForm = document.getElementById('todo-form');
        const todoInput = document.getElementById('todo-input');
        const todoList = document.getElementById('todo-list');
        const emptyState = document.getElementById('empty-state');
        const taskCount = document.getElementById('task-count');
        const clearCompletedBtn = document.getElementById('clear-completed');
        const filterBtns = document.querySelectorAll('#filter-tabs .nav-link');
        let todos = JSON.parse(localStorage.getItem('beige_todos')) || [];
        let currentFilter = 'all';

        function saveToStorage() {
            localStorage.setItem('beige_todos', JSON.stringify(todos));
        }
        function render() {
            todoList.innerHTML = '';

            const filteredTodos = todos.filter(todo => {
                if (currentFilter === 'active') return !todo.completed;
                if (currentFilter === 'completed') return todo.completed;
                return true;
            });
            emptyState.style.display = filteredTodos.length === 0 ? 'block' : 'none';
            filteredTodos.forEach(todo => {
                const li = document.createElement('li');
                li.className = `list-group-item d-flex justify-content-between align-items-center todo-item p-3 ${todo.completed ? 'completed' : ''}`;
                li.innerHTML = `
                    <div class="form-check d-flex align-items-center mb-0 gap-2 flex-grow-1">
                        <input class="form-check-input mt-0" type="checkbox" ${todo.completed ? 'checked' : ''} onchange="toggleTodo('${todo.id}')">
                        <span class="todo-text text-break ms-2">${escapeHTML(todo.text)}</span>
                    </div>
                    <button class="btn btn-sm btn-delete border-0 rounded-circle ms-2" onclick="deleteTodo('${todo.id}')" title="Delete Task">
                        <i class="bi bi-trash"></i>
                    </button>
                `;
                todoList.appendChild(li);
            });
            const pendingCount = todos.filter(t => !t.completed).length;
            const completedCount = todos.filter(t => t.completed).length;
            taskCount.textContent = `${pendingCount} ${pendingCount === 1 ? 'task' : 'tasks'} remaining`;
            clearCompletedBtn.style.display = completedCount > 0 ? 'inline-block' : 'none';
        }
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }
        todoForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = todoInput.value.trim();
            if (text !== '') {
                todos.push({ id: Date.now().toString(), text: text, completed: false });
                saveToStorage();
                render();
                todoInput.value = '';
            }
        });
        window.toggleTodo = function(id) {
            todos = todos.map(todo => todo.id === id ? { ...todo, completed: !todo.completed } : todo);
            saveToStorage();
            render();
        };
        window.deleteTodo = function(id) {
            todos = todos.filter(todo => todo.id !== id);
            saveToStorage();
            render();
        };

        clearCompletedBtn.addEventListener('click', () => {
            todos = todos.filter(todo => !todo.completed);
            saveToStorage();
            render();
        });

        filterBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                filterBtns.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentFilter = e.target.getAttribute('data-filter');
                render();
            });
        });
        render();
    </script>
</body>
</html>
